<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dove vuoi andare? 🗺️</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: linear-gradient(135deg, #ffb6d5, #ffd9e8 50%, #fff0f6);
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 20px; text-align: center;
  }
  .card {
    background: rgba(255,255,255,0.75);
    backdrop-filter: blur(6px);
    padding: 50px 40px;
    border-radius: 30px;
    box-shadow: 0 25px 60px rgba(200,60,120,0.25);
    max-width: 700px;
    width: 100%;
    animation: pop .5s ease;
  }
  @keyframes pop {
    from { transform: scale(.8); opacity: 0; }
    to   { transform: scale(1);  opacity: 1; }
  }
  h1 { color: #c2185b; font-size: clamp(1.6rem,4.5vw,2.6rem); margin: 0 0 10px; }
  .sub { color: #a13363; font-size: 1.05rem; margin: 0 0 35px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px,1fr));
    gap: 18px;
    margin-bottom: 25px;
  }
  .choice {
    font-family: inherit;
    font-size: 1.15rem;
    font-weight: 700;
    padding: 22px 10px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    color: #fff;
    transition: transform .15s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .choice .emoji { font-size: 2rem; }
  .choice:hover  { transform: translateY(-5px) scale(1.04); }
  .choice:active { transform: scale(.97); }
  #cinema { background: linear-gradient(135deg,#e91e63,#ff6090); box-shadow: 0 8px 20px rgba(233,30,99,.35); }
  #corso  { background: linear-gradient(135deg,#9c27b0,#ce93d8); box-shadow: 0 8px 20px rgba(156,39,176,.35); }
  #stadio { background: linear-gradient(135deg,#3f51b5,#7986cb); box-shadow: 0 8px 20px rgba(63,81,181,.35); }
  #hola   { background: linear-gradient(135deg,#ff9800,#ffc107); box-shadow: 0 8px 20px rgba(255,152,0,.35); }
  .back {
    display: inline-block;
    margin-top: 10px;
    color: #b05070;
    text-decoration: none;
    font-size: .95rem;
  }
  .back:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="card">
  <h1>Dove vuoi andare? 💭</h1>
  <p class="sub">Scegli una delle quattro opzioni 👇</p>

  <div class="grid">
    <button class="choice" id="cinema" onclick="location.href='si.html?luogo=Cinema'">
      <span class="emoji">🎬</span> Cinema
    </button>
    <button class="choice" id="corso" onclick="location.href='si.html?luogo=Corso'">
      <span class="emoji">🛍️</span> Corso
    </button>
    <button class="choice" id="stadio" onclick="location.href='si.html?luogo=Stadio'">
      <span class="emoji">⚽</span> Stadio
    </button>
    <button class="choice" id="hola" onclick="location.href='si.html?luogo=Hola'">
      <span class="emoji">🎉</span> Hola
    </button>
  </div>

  <a class="back" href="index.html">← Torna indietro</a>
</div>

</body>
</html>
